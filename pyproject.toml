[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strict-types"
version = "0.1.0"
description = "A Python library providing strict numeric types with bounded values."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Mikhail" }
]
keywords = ["types", "typing", "integers", "validation", "strict"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Typing :: Typed"
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "build>=1.2"
]

[tool.setuptools.packages.find]
include = ["strict_types*"]

[tool.setuptools.package-data]
strict_types = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "test.py"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true